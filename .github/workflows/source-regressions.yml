name: Source regressions

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-source-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: python -m compileall -q tools templates release tests
      - name: Run isolated build environment tests
        run: python -m unittest discover -s tests -p test_build_environment.py -v
      - name: Run prebuilt plugin packaging regressions
        run: python -m unittest discover -s tests -p test_package_existing.py -v
      - name: Assemble development skill kit (preserve published v0.2.4)
        run: python release/pack_skill.py --development
      - name: Verify bundled skill kit integrity
        run: python -m unittest discover -s tests -p test_kit_source_sync.py -v
      - name: Check visible UI labels and stable internal names
        run: python -m unittest discover -s tests -p test_ui_labels.py -v
      - name: Exercise isolated release packager tests
        run: python -m unittest discover -s release -p test_pack_skill.py -v
      - name: Check development-branch skill assembly is reproducible (not a release)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          python release/pack_skill.py --development
          $first = (Get-FileHash release/zw3d-plugin-dev-0.2.5-dev.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          python release/pack_skill.py --development
          $second = (Get-FileHash release/zw3d-plugin-dev-0.2.5-dev.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($first -ne $second) { throw "Development skill assembly is not reproducible" }
      - name: Retain development candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: zw3d-plugin-dev-0.2.5-dev
          path: release/zw3d-plugin-dev-0.2.5-dev.zip
      - name: Run existing source-only regression tests
        run: |
          python -m unittest discover -s templates/tests -v
          python -m unittest discover -s tests -p test_release_guards.py -v

  native-manager-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
      - name: Check HubManager C++ source without proprietary SDK
        shell: msys2 {0}
        run: g++ -std=c++17 -DHUB_MANAGER -DUNICODE -D_UNICODE -fsyntax-only framework/setup.cpp
