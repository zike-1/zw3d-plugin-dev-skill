name: Source regressions

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-source-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: python -m compileall -q tools templates release tests
      - name: Run isolated build environment tests
        run: python -m unittest discover -s tests -p test_build_environment.py -v
      - name: Verify bundled skill kit integrity
        run: python -m unittest discover -s tests -p test_kit_source_sync.py -v
      - name: Run existing source-only regression tests
        run: |
          python -m unittest discover -s templates/tests -v
          python -m unittest discover -s tests -p test_release_guards.py -v
